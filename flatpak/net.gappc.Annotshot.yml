# Flatpak build of Annotshot from this checkout.
#   flatpak-builder --user --install-deps-from=flathub --force-clean \
#     --repo=<repo-dir> <build-dir> flatpak/net.gappc.Annotshot.yml
# Keep <build-dir> and flatpak-builder's state directory outside the checkout.
# After Cargo.lock changes: python3 flatpak/gen-cargo-sources.py
id: net.gappc.Annotshot
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: annotshot
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
modules:
  - name: annotshot
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/annotshot/cargo
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/annotshot -t /app/bin
      - sed 's|@BINDIR@/||' data/net.gappc.Annotshot.desktop > net.gappc.Annotshot.desktop
      - install -Dm644 net.gappc.Annotshot.desktop -t /app/share/applications
      - install -Dm644 data/net.gappc.Annotshot.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 data/net.gappc.Annotshot.metainfo.xml -t /app/share/metainfo
    sources:
      - type: dir
        path: ..
        skip:  # build output, and flatpak-builder's own dirs when run from the checkout (CI)
          - .git
          - target
          - tests/gui/out
          - .superpowers
          - .flatpak-builder
          - flatpak_app
          - repo
      - cargo-sources.json
